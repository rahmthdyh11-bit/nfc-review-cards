<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Review Cards - Dashboard</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 700px;

            margin: 50px auto;

            padding: 20px;

            background: #f5f5f5;

        }

        .login-container {

            max-width: 500px;

            margin: 80px auto;

            padding: 30px;

            box-sizing: border-box;

            background: white;

            border-radius: 12px;

        }

        .login-container h1 {

            text-align: center;

        }

        .login-container input {

            margin: 8px 0;

        }

        .login-container button {

            margin-top: 10px;

        }

        #loginMessage {

            margin-top: 15px;

            text-align: center;

        }


        .container {

            background: white;

            padding: 30px;

            border-radius: 12px;

        }


        h1 {

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-top: 20px;

            margin-bottom: 6px;

            font-weight: bold;

        }


        input,
        select {

            width: 100%;

            padding: 12px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 6px;

        }

        .destination-input-row {

            display: flex;

            gap: 8px;

        }

        .destination-input-row input {

            flex: 1;

            min-width: 0;

        }

        .paste-button {

            width: auto;

            margin-top: 0;

            padding: 0 16px;

            background: #f97316;

            color: white;

        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 25px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

        }


        #saveBtn {

            background: #222;

            color: white;

        }


        #resetShopBtn {

            background: #b42318;

            color: white;

        }


        #logoutBtn {

            background: #ddd;

        }


        #message {

            margin-top: 20px;

            font-weight: bold;

        }


        .status {

            margin-top: 20px;

        }


        .active-section {

            margin-bottom: 30px;

            padding: 20px;

            background: #f7f7f7;

            border-radius: 10px;

        }


        .active-section h2 {

            margin-top: 0;

            margin-bottom: 8px;

        }


        .active-section p {

            margin-top: 0;

            color: #666;

        }

    </style>

</head>


<body>

<div id="loginContainer" class="login-container" hidden>

    <h1>Admin Login</h1>

    <form id="loginForm">
        <label for="email">Admin Email</label>
        <input type="email" id="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button id="loginBtn" type="submit">Login</button>
    </form>

    <p id="loginMessage" role="status" aria-live="polite"></p>

</div>

<div id="dashboardContainer" class="container" hidden>


    <h1>
        NFC Review Cards Admin
    </h1>


    <!-- ACTIVE CARDS SECTION -->

    <div class="active-section">

        <h2>
            Active Cards
        </h2>

        <p>
            Select a shop to manage its card.
        </p>


        <select id="activeCardSelect">

            <option value="">
                Loading active cards...
            </option>

        </select>

    </div>


    <!-- EXISTING CARD SELECT -->

    <label for="cardSelect">

        Select Card

    </label>


    <select id="cardSelect">

        <option value="">
            Loading cards...
        </option>

    </select>


    <label for="shopName">

        Shop Name

    </label>


    <input
        type="text"
        id="shopName"
        placeholder="Example: Sharma Restaurant"
    >

    <label for="shopLocation">

        City, Regency, or District

    </label>

    <input
        type="text"
        id="shopLocation"
        placeholder="Example: Bandung, West Java"
    >

    <p>
        <a id="shopSearch" href="#" target="_blank" rel="noopener noreferrer" hidden>Search this shop on Google</a>
    </p>

    <label for="reviewUrl">

        Google Destination Link

    </label>

    <div class="destination-input-row">
        <input
            type="url"
            id="reviewUrl"
            placeholder="Paste the Google link to open when the card is scanned"
        >
        <button id="pasteReviewUrlButton" class="paste-button" type="button">Tempel</button>
    </div>

    <p id="pasteReviewUrlStatus" role="status" aria-live="polite"></p>

    <p>
        Paste the Google Search, Maps, or direct review link to use for this card.
        <a id="mapsPreview" href="#" target="_blank" rel="noopener noreferrer" hidden>Preview link</a>
    </p>


    <div class="status">


        <label>

            Card Status

        </label>


        <select id="active">

            <option value="true">
                Active
            </option>

            <option value="false">
                Inactive
            </option>

        </select>


    </div>


    <button id="saveBtn">

        Save Card

    </button>


    <button id="resetShopBtn" type="button">

        Reset Data Toko

    </button>


    <p id="message"></p>


    <button id="logoutBtn">

        Logout

    </button>


</div>



<script type="module">


    import {

        initializeApp

    } from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


    import {

        getAuth,

        onAuthStateChanged,

        signOut,

        signInWithEmailAndPassword

    } from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


    import {

        getFirestore,

        collection,

        getDocs,
        doc,
        getDoc,
        writeBatch

    } from
        "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";



    // Firebase configuration

    const firebaseConfig = {

        apiKey:
            "AIzaSyCfvYDLykMDUcOhccvLQP8U5HEOJw2rvfQ",

        authDomain:
            "nfc-review-cards-3184f.firebaseapp.com",

        projectId:
            "nfc-review-cards-3184f",

        storageBucket:
            "nfc-review-cards-3184f.firebasestorage.app",

        messagingSenderId:
            "963480595601",

        appId:
            "1:963480595601:web:27fcfff3d3e4cea01fa330"

    };



    // Initialize Firebase

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);

    const loginContainer =
        document.getElementById("loginContainer");

    const dashboardContainer =
        document.getElementById("dashboardContainer");

    const loginForm =
        document.getElementById("loginForm");

    const loginBtn =
        document.getElementById("loginBtn");

    const loginMessage =
        document.getElementById("loginMessage");

    const urlParams =
        new URLSearchParams(window.location.search);

    const cardIdFromUrl =
        urlParams.get("card");

    const cardIdFromSession =
        sessionStorage.getItem("selectedCard");

    const selectedCardId =
        cardIdFromUrl || cardIdFromSession;

    async function loginWithRetry(email, password) {
        const maxAttempts = 3;

        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            try {
                loginMessage.textContent = attempt === 1
                    ? "Signing in..."
                    : "Connection interrupted. Retrying...";
                await signInWithEmailAndPassword(auth, email, password);
                return;
            } catch (error) {
                console.error(`Login attempt ${attempt} failed:`, error);
                if (error.code !== "auth/network-request-failed" || attempt === maxAttempts) {
                    throw error;
                }

                await new Promise(resolve => setTimeout(resolve, attempt * 1000));
            }
        }
    }

    loginForm.addEventListener("submit", async event => {
        event.preventDefault();
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        try {
            await loginWithRetry(
                document.getElementById("email").value.trim(),
                document.getElementById("password").value
            );
            loginMessage.textContent = "Login successful.";
        } catch (error) {
            console.error("Admin login failed:", error);
            if (error.code === "auth/network-request-failed") {
                loginMessage.textContent =
                    "Unable to connect to Firebase. Check your internet connection and try again.";
            } else if (error.code === "auth/invalid-credential") {
                loginMessage.textContent = "Invalid email or password.";
            } else if (error.code === "auth/invalid-email") {
                loginMessage.textContent = "Please enter a valid email address.";
            } else if (error.code === "auth/user-disabled") {
                loginMessage.textContent = "This account has been disabled.";
            } else {
                loginMessage.textContent = "Login failed: " + error.message;
            }

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
        }
    });


    // Get HTML elements

    const cardSelect =
        document.getElementById(
            "cardSelect"
        );


    const activeCardSelect =
        document.getElementById(
            "activeCardSelect"
        );


    const shopName =
        document.getElementById(
            "shopName"
        );

    const shopLocation =
        document.getElementById(
            "shopLocation"
        );

    const shopSearch =
        document.getElementById(
            "shopSearch"
        );

    const reviewUrl =
        document.getElementById(
            "reviewUrl"
        );

    const mapsPreview =
        document.getElementById(
            "mapsPreview"
        );

    const pasteReviewUrlButton =
        document.getElementById(
            "pasteReviewUrlButton"
        );

    const pasteReviewUrlStatus =
        document.getElementById(
            "pasteReviewUrlStatus"
        );

    pasteReviewUrlButton.addEventListener("click", async () => {
        pasteReviewUrlButton.disabled = true;
        pasteReviewUrlStatus.textContent = "";
        try {
            if (!navigator.clipboard?.readText) {
                throw new Error("Clipboard access is unavailable.");
            }

            reviewUrl.value = (await navigator.clipboard.readText()).trim();
            reviewUrl.dispatchEvent(new Event("input", { bubbles: true }));
            pasteReviewUrlStatus.textContent = reviewUrl.value
                ? "Link berhasil ditempel."
                : "Clipboard kosong.";
        } catch (error) {
            console.error("Could not paste Google destination link:", error);
            pasteReviewUrlStatus.textContent =
                "Clipboard tidak bisa dibaca. Tempel link secara manual dengan Ctrl+V.";
        } finally {
            pasteReviewUrlButton.disabled = false;
        }
    });

    function updateShopSearch() {
        const searchText = [
            shopName.value.trim(),
            shopLocation.value.trim()
        ].filter(Boolean).join(" ");

        if (!searchText) {
            shopSearch.hidden = true;
            shopSearch.removeAttribute("href");
            return;
        }

        const searchUrl = new URL("https://www.google.com/search");
        searchUrl.searchParams.set("q", searchText);
        shopSearch.href = searchUrl.toString();
        shopSearch.hidden = false;
    }

    function updateDestinationPreview() {
        const destination = reviewUrl.value.trim();
        if (!destination) {
            mapsPreview.hidden = true;
            mapsPreview.removeAttribute("href");
            return;
        }

        mapsPreview.href = destination;
        mapsPreview.hidden = false;
    }

    shopName.addEventListener("input", updateShopSearch);
    shopLocation.addEventListener("input", updateShopSearch);
    reviewUrl.addEventListener("input", updateDestinationPreview);


    const active =
        document.getElementById(
            "active"
        );


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    const resetShopBtn =
        document.getElementById(
            "resetShopBtn"
        );


    const logoutBtn =
        document.getElementById(
            "logoutBtn"
        );


    const message =
        document.getElementById(
            "message"
        );



    // Check authentication

    onAuthStateChanged(

        auth,

        async (user) => {

            if (!user) {
                loginContainer.hidden = false;
                dashboardContainer.hidden = true;
                return;
            }

            loginContainer.hidden = true;
            dashboardContainer.hidden = false;
            await loadCards();
        }

    );



    // Load all cards from Firestore

    async function loadCards() {


        console.log(
            "loadCards() started"
        );


        try {


            const cardsSnapshot =
                await getDocs(

                    collection(

                        db,

                        "cards"

                    )

                );


            console.log(
                "Cards found:",
                cardsSnapshot.size
            );


            // Clear normal card dropdown

            cardSelect.innerHTML =
                '<option value="">Select a card</option>';


            // Clear active card dropdown

            activeCardSelect.innerHTML =
                '<option value="">Select an active shop</option>';



            cardsSnapshot.forEach(

                (card) => {


                    console.log(
                        "Card:",
                        card.id
                    );


                    const data =
                        card.data();



                    // --------------------------------
                    // NORMAL CARD DROPDOWN
                    // --------------------------------

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        card.id;


                    option.textContent =
                        card.id;


                    cardSelect.appendChild(
                        option
                    );



                    // --------------------------------
                    // ACTIVE CARDS DROPDOWN
                    // --------------------------------

                    if (
                        data.active === true
                    ) {


                        const activeOption =
                            document.createElement(
                                "option"
                            );


                        activeOption.value =
                            card.id;


                        const name =
                            data.shopName ||
                            "Unnamed Shop";


                        activeOption.textContent =
                            name +
                            " — " +
                            card.id;


                        activeCardSelect.appendChild(
                            activeOption
                        );

                    }

                }

            );


            console.log(
                "Cards added to dropdowns."
            );



            // Read Card ID from URL

            const cardId =
                selectedCardId;


            console.log(
                "Card ID from URL:",
                cardId
            );



            // Automatically select card

            if (cardId) {


                console.log(
                    "Trying to select:",
                    cardId
                );


                cardSelect.value =
                    cardId;


                console.log(
                    "Dropdown value after selection:",
                    cardSelect.value
                );


                if (

                    cardSelect.value ===
                    cardId

                ) {


                    console.log(
                        "Card selected successfully:",
                        cardId
                    );


                    await loadSelectedCard(
                        cardId
                    );


                } else {


                    console.log(
                        "Could not select card:",
                        cardId
                    );


                    message.textContent =
                        "Card not found.";

                }

            }


        } catch (error) {


            console.error(
                "Error loading cards:",
                error
            );


            message.textContent =
                "Error loading cards: " +
                error.message;

        }

    }



    // --------------------------------
    // ACTIVE CARD SELECTION
    // --------------------------------

    activeCardSelect.addEventListener(

        "change",

        async () => {


            const cardId =
                activeCardSelect.value;


            console.log(
                "Active card selected:",
                cardId
            );


            if (!cardId) {

                return;

            }


            // Keep the existing card dropdown
            // synchronized

            cardSelect.value =
                cardId;


            await loadSelectedCard(
                cardId
            );

        }

    );



    // Load selected card data

    async function loadSelectedCard(

        cardId

    ) {


        console.log(
            "Loading selected card:",
            cardId
        );


        if (!cardId) {


            shopName.value =
                "";

            shopLocation.value =
                "";

            updateShopSearch();

            reviewUrl.value =
                "";

            mapsPreview.hidden = true;


            active.value =
                "false";


            return;

        }


        try {


            const cardRef =
                doc(

                    db,

                    "cards",

                    cardId

                );


            const cardSnapshot =
                await getDoc(

                    cardRef

                );


            if (

                cardSnapshot.exists()

            ) {


                const data =
                    cardSnapshot.data();


                console.log(
                    "Card data:",
                    data
                );


                shopName.value =
                    data.shopName || "";

                shopLocation.value =
                    data.shopLocation || "";

                updateShopSearch();

                reviewUrl.value =
                    data.destination || "";

                updateDestinationPreview();


                active.value =
                    data.active
                        ? "true"
                        : "false";

            }


        } catch (error) {


            console.error(
                "Error loading selected card:",
                error
            );


            message.textContent =
                "Error loading card: " +
                error.message;

        }

    }



    // When a card is selected manually

    cardSelect.addEventListener(

        "change",

        async () => {


            const cardId =
                cardSelect.value;


            console.log(
                "Selected card:",
                cardId
            );


            await loadSelectedCard(
                cardId
            );

        }

    );



    // Save card

    saveBtn.addEventListener(

        "click",

        async () => {


            const cardId =
                cardSelect.value;


            const shop =
                shopName.value.trim();

            const location =
                shopLocation.value.trim();


            const url =
                reviewUrl.value.trim();


            const isActive =
                active.value === "true";


            console.log(
                "Saving card:",
                cardId
            );


            if (!cardId) {


                message.textContent =
                    "Please select a card.";


                return;

            }


            if (!shop) {


                message.textContent =
                    "Please enter the shop name.";


                return;

            }

            if (!location) {
                message.textContent =
                    "Please enter the city, regency, or district.";

                return;
            }


            if (!url) {


                message.textContent =
                    "Enter the Google destination link for this card.";


                return;

            }


            try {


                const cardRef =
                    doc(

                        db,

                        "cards",

                        cardId

                    );

                const destinationRef =
                    doc(

                        db,

                        "cardDestinations",

                        cardId

                    );

                const batch = writeBatch(db);
                batch.update(cardRef, {

                        shopName: shop,

                        shopLocation: location,

                        destination: url,

                        active: isActive

                    });
                batch.set(destinationRef, {
                    active: isActive,
                    destination: isActive ? url : ""
                });
                await batch.commit();


                console.log(
                    "Card saved successfully."
                );


                message.textContent =
                    "Card saved successfully!";


                // Reload both dropdowns so that
                // changes in shop name/status
                // appear immediately.

                await loadCards();


                // Restore the card we just saved.

                cardSelect.value =
                    cardId;


                activeCardSelect.value =
                    cardId;


                await loadSelectedCard(
                    cardId
                );


            } catch (error) {


                console.error(
                    "Error saving card:",
                    error
                );


                message.textContent =
                    "Error saving card: " +
                    error.message;

            }

        }

    );


    // Reset shop data so the card can be activated again without the password.

    resetShopBtn.addEventListener(

        "click",

        async () => {

            const cardId = cardSelect.value;
            if (!cardId) {
                message.textContent =
                    "Please select a card to reset.";
                return;
            }

            const shop = shopName.value.trim();
            const confirmed = window.confirm(
                `Reset data toko pada kartu ${cardId}${shop ? ` (${shop})` : ""}? ` +
                "Kartu akan dinonaktifkan dan data toko/link tujuan dihapus. " +
                "Setelah kartu dipindai, data toko dapat diisi kembali tanpa password aktivasi."
            );
            if (!confirmed) {
                return;
            }

            resetShopBtn.disabled = true;
            message.textContent = "Mereset data toko...";

            try {
                const batch = writeBatch(db);
                batch.update(doc(db, "cards", cardId), {
                    shopName: "",
                    shopLocation: "",
                    destination: "",
                    active: false,
                    activationPasswordVerified: true
                });
                batch.delete(doc(db, "cardDestinations", cardId));
                await batch.commit();

                await loadCards();
                cardSelect.value = cardId;
                activeCardSelect.value = "";
                await loadSelectedCard(cardId);
                message.textContent =
                    "Data toko berhasil direset. Pindai kartu untuk mengisi data toko baru tanpa password aktivasi.";
            } catch (error) {
                console.error("Error resetting shop data:", error);
                message.textContent =
                    "Gagal mereset data toko: " +
                    error.message;
            } finally {
                resetShopBtn.disabled = false;
            }
        }

    );


    // Logout

    logoutBtn.addEventListener(

        "click",

        async () => {


            await signOut(
                auth
            );

        }

    );


</script>


</body>

</html>
