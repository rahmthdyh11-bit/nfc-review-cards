<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>NFC Review Card</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            width: min(100%, 460px);
            padding: 32px;
            box-sizing: border-box;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 40px rgb(23 32 51 / 10%);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        p {
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #cbd2df;
            border-radius: 8px;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #f97316;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #ea580c;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 3px solid rgb(249 115 22 / 35%);
            outline-offset: 2px;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            min-height: 24px;
            margin-bottom: 0;
        }

        .muted {
            color: #596579;
        }

        .business-search {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            background: #f8fafc;
        }

        .business-search label {
            margin-top: 0;
        }

        .business-search input {
            margin-bottom: 0;
        }

        .business-search-status {
            margin: 9px 0 0;
            font-size: 13px;
        }

        .business-results {
            display: none;
            max-height: 240px;
            overflow-y: auto;
            margin-top: 8px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            background: #fff;
        }

        .business-result {
            display: block;
            width: 100%;
            margin: 0;
            padding: 12px;
            border-bottom: 1px solid #e8edf4;
            border-radius: 0;
            background: #fff;
            color: #172033;
            text-align: left;
            cursor: pointer;
        }

        .business-result:last-child {
            border-bottom: 0;
        }

        .business-result:hover,
        .business-result:focus-visible {
            background: #fff7ed;
        }

        .business-result strong,
        .business-result small {
            display: block;
        }

        .business-result small {
            margin-top: 4px;
            color: #596579;
            font-weight: 400;
            line-height: 1.4;
        }

        .business-selected {
            display: none;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            background: #fff7ed;
        }

        .business-selected p {
            margin: 5px 0 0;
            font-size: 13px;
        }

        .business-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .business-actions button,
        .business-actions a {
            flex: 1;
            width: auto;
            margin: 0;
            padding: 10px;
            border-radius: 7px;
            font-size: 13px;
            text-align: center;
            text-decoration: none;
        }

        .business-actions a {
            display: grid;
            place-items: center;
            border: 1px solid #cbd2df;
            background: #fff;
            color: #172033;
            font-weight: 700;
        }

        @media (max-width: 420px) {
            .business-actions {
                flex-direction: column;
            }
        }

        .business-actions .secondary-button {
            background: #ea580c;
        }
    </style>
</head>
<body>
    <main>
        <h1 id="title">Memeriksa kartu...</h1>
        <p id="description" class="muted">Mohon tunggu sebentar.</p>
        <div id="activation"></div>
        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfvYDLykMDUcOhccvLQP8U5HEOJw2rvfQ",
            authDomain: "nfc-review-cards-3184f.firebaseapp.com",
            projectId: "nfc-review-cards-3184f",
            storageBucket: "nfc-review-cards-3184f.firebasestorage.app",
            messagingSenderId: "963480595601",
            appId: "1:963480595601:web:27fcfff3d3e4cea01fa330"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const title = document.getElementById("title");
        const description = document.getElementById("description");
        const activation = document.getElementById("activation");
        const message = document.getElementById("message");

        function showMessage(heading, detail) {
            title.textContent = heading;
            description.textContent = detail;
        }

        function openActivationForm(cardId) {
            showMessage("Aktivasi kartu", "Isi nama toko, lokasi, dan tempel link Google yang ingin dibuka saat kartu dipindai.");
            activation.innerHTML = `
                <form id="activationForm">
                    <p class="muted">Kode kartu: <strong id="cardCode"></strong></p>
                    <label for="activationPassword">Password aktivasi</label>
                    <input id="activationPassword" name="activationPassword" type="password" required autocomplete="current-password" maxlength="128" placeholder="Masukkan password aktivasi">
                    <label for="shopName">Nama toko / bisnis</label>
                    <input id="shopName" name="shopName" type="text" maxlength="100" required autocomplete="organization" placeholder="Contoh: Kedai Kopi">
                    <div class="business-search">
                        <label for="businessSearch">Cari dan pilih bisnis</label>
                        <input id="businessSearch" type="search" maxlength="120" autocomplete="off" placeholder="Ketik minimal 2 karakter">
                        <p id="businessSearchStatus" class="muted business-search-status" role="status" aria-live="polite">Cari nama bisnis, lalu pilih hasil yang benar.</p>
                        <div id="businessResults" class="business-results" role="listbox" aria-label="Hasil pencarian bisnis"></div>
                        <div id="businessSelected" class="business-selected">
                            <strong id="businessSelectedName"></strong>
                            <p id="businessSelectedAddress" class="muted"></p>
                            <div class="business-actions">
                                <a id="openBusinessMaps" href="#" target="_blank" rel="noopener noreferrer">Buka di Maps</a>
                                <button id="copyBusinessReview" class="secondary-button" type="button">Salin Link Review Google</button>
                            </div>
                            <p id="businessCopyMessage" class="muted business-search-status" role="status" aria-live="polite"></p>
                        </div>
                    </div>
                    <label for="shopLocation">Kota, kabupaten, atau kecamatan</label>
                    <input id="shopLocation" name="shopLocation" type="text" maxlength="100" required autocomplete="address-level2" placeholder="Contoh: Bandung, Jawa Barat">
                    <a id="shopSearch" href="#" target="_blank" rel="noopener noreferrer" hidden>Cari toko di Google</a>
                    <label for="destination">Link Google tujuan</label>
                    <input id="destination" name="destination" type="url" required inputmode="url" placeholder="Tempel link Google Search atau link ulasan">
                    <p class="muted">Tempel link yang ingin dibuka ketika kartu dipindai. Link ulasan langsung biasanya membawa pelanggan ke halaman tulis ulasan.</p>
                    <a id="destinationPreview" href="#" target="_blank" rel="noopener noreferrer" hidden>Pratinjau link</a>
                    <button id="activateButton" type="submit">Aktifkan kartu</button>
                </form>
            `;
            document.getElementById("cardCode").textContent = cardId;

            const form = document.getElementById("activationForm");
            const shopNameInput = document.getElementById("shopName");
            const shopLocationInput = document.getElementById("shopLocation");
            const activationPasswordInput = document.getElementById("activationPassword");
            const businessSearchInput = document.getElementById("businessSearch");
            const businessSearchStatus = document.getElementById("businessSearchStatus");
            const businessResults = document.getElementById("businessResults");
            const businessSelected = document.getElementById("businessSelected");
            const businessSelectedName = document.getElementById("businessSelectedName");
            const businessSelectedAddress = document.getElementById("businessSelectedAddress");
            const openBusinessMaps = document.getElementById("openBusinessMaps");
            const businessCopyMessage = document.getElementById("businessCopyMessage");
            const shopSearch = document.getElementById("shopSearch");
            const destinationInput = document.getElementById("destination");
            const destinationPreview = document.getElementById("destinationPreview");
            const button = document.getElementById("activateButton");
            let businessSearchTimer;
            let businessSearchController;
            let selectedReviewUrl = "";

            function updateShopSearch() {
                const searchText = [
                    shopNameInput.value.trim(),
                    shopLocationInput.value.trim()
                ].filter(Boolean).join(" ");

                if (!searchText) {
                    shopSearch.hidden = true;
                    shopSearch.removeAttribute("href");
                    return;
                }

                const searchUrl = new URL("https://www.google.com/search");
                searchUrl.searchParams.set("q", searchText);
                shopSearch.href = searchUrl.toString();
                shopSearch.hidden = false;
            }

            function updateDestinationPreview() {
                const value = destinationInput.value.trim();
                if (!value) {
                    destinationPreview.hidden = true;
                    destinationPreview.removeAttribute("href");
                    return;
                }

                destinationPreview.href = value;
                destinationPreview.hidden = false;
            }

            function makeMapsSearchUrl(item) {
                const mapsUrl = new URL("https://www.google.com/maps/search/");
                mapsUrl.searchParams.set("api", "1");
                mapsUrl.searchParams.set("query", item.name || "Business");
                const placeId = item.placeId || item.place_id || item.id;
                if (placeId) {
                    mapsUrl.searchParams.set("query_place_id", placeId);
                }
                return mapsUrl.toString();
            }

            function makeReviewUrl(placeId) {
                const reviewUrl = new URL("https://search.google.com/local/writereview");
                reviewUrl.searchParams.set("placeid", placeId);
                return reviewUrl.toString();
            }

            function clearBusinessSelection() {
                selectedReviewUrl = "";
                businessSelected.hidden = true;
                businessSelected.style.display = "none";
                businessCopyMessage.textContent = "";
                openBusinessMaps.removeAttribute("href");
            }

            async function copyBusinessReview() {
                if (!selectedReviewUrl) {
                    businessCopyMessage.textContent = "Pilih bisnis yang memiliki Place ID terlebih dahulu.";
                    return;
                }

                try {
                    await navigator.clipboard.writeText(selectedReviewUrl);
                    businessCopyMessage.textContent = "Link review berhasil disalin. Tempelkan ke kolom Link Google tujuan.";
                } catch (error) {
                    const copyArea = document.createElement("textarea");
                    copyArea.value = selectedReviewUrl;
                    copyArea.style.position = "fixed";
                    copyArea.style.opacity = "0";
                    document.body.appendChild(copyArea);
                    copyArea.select();
                    const copied = document.execCommand("copy");
                    copyArea.remove();
                    businessCopyMessage.textContent = copied
                        ? "Link review berhasil disalin. Tempelkan ke kolom Link Google tujuan."
                        : "Gagal menyalin. Salin link secara manual: " + selectedReviewUrl;
                }
            }

            function showSelectedBusiness(item) {
                const placeId = item.placeId || item.place_id || item.id || "";
                if (!placeId) {
                    businessSearchStatus.textContent = "Place ID tidak tersedia untuk bisnis ini. Pilih hasil lain.";
                    return;
                }

                shopNameInput.value = item.name || "";
                selectedReviewUrl = makeReviewUrl(placeId);
                businessSelectedName.textContent = item.name || "Nama bisnis tidak tersedia";
                businessSelectedAddress.textContent = item.address || "Alamat tidak tersedia";
                openBusinessMaps.href = makeMapsSearchUrl(item);
                businessResults.replaceChildren();
                businessResults.style.display = "none";
                businessSelected.hidden = false;
                businessSelected.style.display = "block";
                businessSearchStatus.textContent = "Bisnis dipilih. Salin link review, lalu tempelkan ke kolom Link Google tujuan.";
                updateShopSearch();
            }

            async function searchBusinesses(query) {
                if (businessSearchController) {
                    businessSearchController.abort();
                }
                businessSearchController = new AbortController();
                const controller = businessSearchController;
                businessSearchStatus.textContent = "Mencari bisnis...";
                businessResults.replaceChildren();
                businessResults.style.display = "none";

                try {
                    const response = await fetch(
                        "/api/business-search?q=" + encodeURIComponent(query),
                        { signal: controller.signal }
                    );
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || "Pencarian bisnis gagal.");
                    }
                    if (controller !== businessSearchController) {
                        return;
                    }
                    if (!Array.isArray(data) || data.length === 0) {
                        businessSearchStatus.textContent = "Bisnis tidak ditemukan.";
                        return;
                    }

                    businessSearchStatus.textContent = "Pilih bisnis yang benar:";
                    businessResults.style.display = "block";
                    data.forEach(item => {
                        const result = document.createElement("button");
                        result.type = "button";
                        result.className = "business-result";
                        result.setAttribute("role", "option");
                        const name = document.createElement("strong");
                        name.textContent = item.name || "Nama tidak tersedia";
                        const address = document.createElement("small");
                        address.textContent = item.address || "Alamat tidak tersedia";
                        result.append(name, address);
                        result.addEventListener("click", () => showSelectedBusiness(item));
                        businessResults.appendChild(result);
                    });
                } catch (error) {
                    if (error.name === "AbortError") {
                        return;
                    }
                    console.error("Business search failed:", error);
                    businessSearchStatus.textContent = error.message || "Pencarian gagal. Coba lagi.";
                }
            }

            function scheduleBusinessSearch() {
                clearTimeout(businessSearchTimer);
                if (businessSearchController) {
                    businessSearchController.abort();
                }
                clearBusinessSelection();
                businessResults.replaceChildren();
                businessResults.style.display = "none";

                const query = [
                    businessSearchInput.value.trim(),
                    shopLocationInput.value.trim()
                ].filter(Boolean).join(" ");

                if (query.length < 2) {
                    businessSearchStatus.textContent = "Ketik minimal 2 karakter untuk mencari.";
                    return;
                }
                if (query.length > 120) {
                    businessSearchStatus.textContent = "Pencarian maksimal 120 karakter.";
                    return;
                }

                businessSearchTimer = setTimeout(() => searchBusinesses(query), 350);
            }

            document.getElementById("copyBusinessReview")
                .addEventListener("click", copyBusinessReview);
            businessSearchInput.addEventListener("input", scheduleBusinessSearch);
            shopLocationInput.addEventListener("input", scheduleBusinessSearch);
            shopNameInput.addEventListener("input", updateShopSearch);
            shopLocationInput.addEventListener("input", updateShopSearch);
            destinationInput.addEventListener("input", updateDestinationPreview);

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                message.textContent = "";

                const shop = document.getElementById("shopName").value.trim();
                const shopLocation = document.getElementById("shopLocation").value.trim();
                const activationPassword = activationPasswordInput.value;
                const destination = destinationInput.value.trim();
                let parsedDestination;
                try {
                    parsedDestination = new URL(destination);
                } catch {
                    message.textContent = "Tempel link Google yang valid.";
                    return;
                }

                const isAllowedGoogleLink =
                    parsedDestination.protocol === "https:" &&
                    (
                        ((parsedDestination.hostname === "www.google.com" ||
                            parsedDestination.hostname === "google.com") &&
                            parsedDestination.pathname === "/search") ||
                        (parsedDestination.hostname === "search.google.com" &&
                            parsedDestination.pathname === "/local/writereview") ||
                        (parsedDestination.hostname === "g.page" &&
                            /^\/r\/[^/]+\/review\/?$/.test(parsedDestination.pathname)) ||
                        (parsedDestination.hostname === "maps.app.goo.gl" &&
                            parsedDestination.pathname.length > 1)
                    );

                if (
                    !shop ||
                    shop.length > 100 ||
                    !shopLocation ||
                    shopLocation.length > 100 ||
                    activationPassword.length < 12 ||
                    !isAllowedGoogleLink
                ) {
                    message.textContent = "Masukkan password aktivasi dan gunakan link HTTPS dari Google Search, Google review, atau Google Maps.";
                    return;
                }

                button.disabled = true;
                button.textContent = "Mengaktifkan...";
                try {
                    const response = await fetch("/api/activate", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            cardId,
                            activationPassword,
                            shopName: shop,
                            shopLocation,
                            destination
                        })
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || "Aktivasi gagal.");
                    }

                    showMessage("Kartu berhasil diaktifkan", "Kartu siap digunakan. Pemindaian berikutnya akan membuka link tujuan.");
                    activation.innerHTML = "";
                    const openDestination = document.createElement("a");
                    openDestination.href = destination;
                    openDestination.target = "_blank";
                    openDestination.rel = "noopener noreferrer";
                    openDestination.textContent = "Buka link tujuan";
                    activation.appendChild(openDestination);
                } catch (error) {
                    console.error("Card activation failed:", error);
                    message.textContent = error.message || "Aktivasi gagal. Silakan coba lagi.";
                    button.disabled = false;
                    button.textContent = "Aktifkan kartu";
                }
            });
        }

        async function startActivation(cardId) {
            try {
                const cardSnap = await getDoc(doc(db, "cardDestinations", cardId));
                if (!cardSnap.exists()) {
                    openActivationForm(cardId);
                    return;
                }
                const data = cardSnap.data();
                if (data.active === true && data.destination) {
                    window.location.replace(data.destination);
                    return;
                }

                showMessage("Kartu perlu bantuan admin", "Silakan hubungi admin untuk memeriksa status kartu.");
            } catch (error) {
                console.error("Activation card lookup failed:", error);
                showMessage("Tidak dapat memeriksa kartu", "Periksa koneksi atau aturan Firestore, lalu coba lagi.");
            }
        }

        async function openCard(cardId) {
            if (!cardId) {
                showMessage("NFC Review Card", "Pindai QR atau tap kartu NFC untuk memulai.");
                return;
            }

            try {
                const cardSnap = await getDoc(doc(db, "cardDestinations", cardId));
                if (!cardSnap.exists()) {
                    const target = new URL("/aktivasi", window.location.origin);
                    target.searchParams.set("code", cardId);
                    window.location.replace(target.toString());
                    return;
                }
                const data = cardSnap.data();
                if (data.active === true && data.destination) {
                    window.location.replace(data.destination);
                    return;
                }

                const target = new URL("/aktivasi", window.location.origin);
                target.searchParams.set("code", cardId);
                window.location.replace(target.toString());
            } catch (error) {
                console.error("Card lookup failed:", error);
                showMessage("Tidak dapat memeriksa kartu", "Periksa koneksi atau aturan Firestore, lalu coba lagi.");
            }
        }

        const path = window.location.pathname;
        const query = new URLSearchParams(window.location.search);

        if (path === "/aktivasi") {
            const cardId = query.get("code")?.trim();
            if (!cardId) {
                showMessage("Kode kartu tidak ada", "Pindai QR atau tap kartu NFC yang ingin diaktifkan.");
            } else {
                startActivation(cardId);
            }
        } else if (path === "/kelola-kartu") {
            window.location.replace("/admin.html");
        } else if (path.startsWith("/edit/")) {
            const cardId = decodeURIComponent(path.slice("/edit/".length));
            const target = new URL("/admin.html", window.location.origin);
            target.searchParams.set("card", cardId);
            window.location.replace(target.toString());
        } else if (path === "/" || path === "/index.html") {
            openCard("");
        } else {
            openCard(decodeURIComponent(path.slice(1)));
        }
    </script>
</body>
</html>
