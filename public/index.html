<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>NFC Review Card</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            width: min(100%, 460px);
            padding: 32px;
            box-sizing: border-box;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 40px rgb(23 32 51 / 10%);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        p {
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #cbd2df;
            border-radius: 8px;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #1459d9;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            min-height: 24px;
            margin-bottom: 0;
        }

        .muted {
            color: #596579;
        }
    </style>
</head>
<body>
    <main>
        <h1 id="title">Memeriksa kartu...</h1>
        <p id="description" class="muted">Mohon tunggu sebentar.</p>
        <div id="activation"></div>
        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import {
            getFirestore,
            doc,
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfvYDLykMDUcOhccvLQP8U5HEOJw2rvfQ",
            authDomain: "nfc-review-cards-3184f.firebaseapp.com",
            projectId: "nfc-review-cards-3184f",
            storageBucket: "nfc-review-cards-3184f.firebasestorage.app",
            messagingSenderId: "963480595601",
            appId: "1:963480595601:web:27fcfff3d3e4cea01fa330"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const title = document.getElementById("title");
        const description = document.getElementById("description");
        const activation = document.getElementById("activation");
        const message = document.getElementById("message");

        function showMessage(heading, detail) {
            title.textContent = heading;
            description.textContent = detail;
        }

        function openActivationForm(cardId) {
            showMessage("Aktivasi kartu", "Isi nama toko dan lokasi. Link pencarian Google akan dibuat otomatis.");
            activation.innerHTML = `
                <form id="activationForm">
                    <p class="muted">Kode kartu: <strong id="cardCode"></strong></p>
                    <label for="shopName">Nama toko / bisnis</label>
                    <input id="shopName" name="shopName" type="text" maxlength="100" required autocomplete="organization" placeholder="Contoh: Kedai Kopi">
                    <label for="shopLocation">Kota, kabupaten, atau kecamatan</label>
                    <input id="shopLocation" name="shopLocation" type="text" maxlength="100" required autocomplete="address-level2" placeholder="Contoh: Bandung, Jawa Barat">
                    <a id="mapsPreview" href="#" target="_blank" rel="noopener noreferrer" hidden>Cari toko di Google</a>
                    <label for="destination">Link pencarian Google</label>
                    <input id="destination" name="destination" type="url" readonly required>
                    <p class="muted">Setelah kartu diaktifkan, scan akan membuka hasil Google Search di browser. Pilih toko dari hasil pencarian untuk melihat ulasannya. Ini bukan formulir ulasan langsung.</p>
                    <button id="activateButton" type="submit">Aktifkan kartu</button>
                </form>
            `;
            document.getElementById("cardCode").textContent = cardId;

            const form = document.getElementById("activationForm");
            const shopNameInput = document.getElementById("shopName");
            const shopLocationInput = document.getElementById("shopLocation");
            const destinationInput = document.getElementById("destination");
            const mapsPreview = document.getElementById("mapsPreview");
            const button = document.getElementById("activateButton");

            function updateMapsSearchLink() {
                const searchText = [
                    shopNameInput.value.trim(),
                    shopLocationInput.value.trim()
                ].filter(Boolean).join(" ");

                if (!searchText) {
                    destinationInput.value = "";
                    mapsPreview.hidden = true;
                    mapsPreview.removeAttribute("href");
                    return;
                }

                const searchUrl = new URL("https://www.google.com/search");
                searchUrl.searchParams.set("q", searchText);
                destinationInput.value = searchUrl.toString();
                mapsPreview.href = searchUrl.toString();
                mapsPreview.hidden = false;
            }

            shopNameInput.addEventListener("input", updateMapsSearchLink);
            shopLocationInput.addEventListener("input", updateMapsSearchLink);

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                message.textContent = "";

                const shop = shopNameInput.value.trim();
                const shopLocation = shopLocationInput.value.trim();
                const destination = destinationInput.value.trim();
                let parsedDestination;
                try {
                    parsedDestination = new URL(destination);
                } catch {
                    message.textContent = "Isi nama toko dan lokasi untuk membuat link pencarian Google.";
                    return;
                }

                const isGoogleSearchLink =
                    parsedDestination.protocol === "https:" &&
                    parsedDestination.hostname === "www.google.com" &&
                    parsedDestination.pathname === "/search" &&
                    parsedDestination.searchParams.has("q");

                if (
                    !shop ||
                    shop.length > 100 ||
                    !shopLocation ||
                    shopLocation.length > 100 ||
                    !isGoogleSearchLink
                ) {
                    message.textContent = "Isi nama toko dan lokasi agar link pencarian Google dibuat otomatis.";
                    return;
                }

                button.disabled = true;
                button.textContent = "Mengaktifkan...";
                try {
                    const cardRef = doc(db, "cards", cardId);
                    const current = await getDoc(cardRef);
                    if (!current.exists()) {
                        throw new Error("Kartu belum didaftarkan. Hubungi admin.");
                    }

                    const data = current.data();
                    if (data.active === true || data.destination) {
                        showMessage("Kartu sudah aktif", "Hubungi admin jika Anda perlu mengubah informasi kartu.");
                        activation.replaceChildren();
                        return;
                    }

                    await updateDoc(cardRef, {
                        shopName: shop,
                        shopLocation,
                        destination,
                        active: true
                    });

                    showMessage("Kartu berhasil diaktifkan", "Mengarahkan ke hasil pencarian Google...");
                    window.location.replace(destination);
                } catch (error) {
                    console.error("Card activation failed:", error);
                    message.textContent = error.message === "Kartu belum didaftarkan. Hubungi admin."
                        ? error.message
                        : "Aktivasi gagal. Kartu mungkin sudah diaktifkan atau aturan Firestore belum diperbarui.";
                    button.disabled = false;
                    button.textContent = "Aktifkan kartu";
                }
            });
        }

        async function startActivation(cardId) {
            try {
                const cardSnap = await getDoc(doc(db, "cards", cardId));
                if (!cardSnap.exists()) {
                    showMessage("Kartu tidak ditemukan", "Kode kartu belum didaftarkan. Silakan hubungi admin.");
                    return;
                }

                const data = cardSnap.data();
                if (data.active === true && data.destination) {
                    window.location.replace(data.destination);
                    return;
                }

                if (data.destination) {
                    showMessage("Kartu perlu bantuan admin", "Silakan hubungi admin untuk memeriksa status kartu.");
                    return;
                }

                openActivationForm(cardId);
            } catch (error) {
                console.error("Activation card lookup failed:", error);
                showMessage("Tidak dapat memeriksa kartu", "Periksa koneksi atau aturan Firestore, lalu coba lagi.");
            }
        }

        async function openCard(cardId) {
            if (!cardId) {
                showMessage("NFC Review Card", "Pindai QR atau tap kartu NFC untuk memulai.");
                return;
            }

            try {
                const cardSnap = await getDoc(doc(db, "cards", cardId));
                if (!cardSnap.exists()) {
                    showMessage("Kartu tidak ditemukan", "Kode kartu belum didaftarkan. Silakan hubungi admin.");
                    return;
                }

                const data = cardSnap.data();
                if (data.active === true && data.destination) {
                    window.location.replace(data.destination);
                    return;
                }

                const target = new URL("/aktivasi", window.location.origin);
                target.searchParams.set("code", cardId);
                window.location.replace(target.toString());
            } catch (error) {
                console.error("Card lookup failed:", error);
                showMessage("Tidak dapat memeriksa kartu", "Periksa koneksi atau aturan Firestore, lalu coba lagi.");
            }
        }

        const path = window.location.pathname;
        const query = new URLSearchParams(window.location.search);

        if (path === "/aktivasi") {
            const cardId = query.get("code")?.trim();
            if (!cardId) {
                showMessage("Kode kartu tidak ada", "Pindai QR atau tap kartu NFC yang ingin diaktifkan.");
            } else {
                startActivation(cardId);
            }
        } else if (path === "/kelola-kartu") {
            window.location.replace("/admin.html");
        } else if (path.startsWith("/edit/")) {
            const cardId = decodeURIComponent(path.slice("/edit/".length));
            const target = new URL("/admin.html", window.location.origin);
            target.searchParams.set("card", cardId);
            window.location.replace(target.toString());
        } else if (path === "/" || path === "/index.html") {
            openCard("");
        } else {
            openCard(decodeURIComponent(path.slice(1)));
        }
    </script>
</body>
</html>
